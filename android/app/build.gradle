plugins {
    id 'com.android.application'
}

android {
    namespace 'tech.obscureoctopus.watch'
    compileSdk 34
    defaultConfig {
        applicationId 'tech.obscureoctopus.watch'
        minSdk 26
        targetSdk 34
        versionCode 26
        versionName '2.6.0-sms'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
}
